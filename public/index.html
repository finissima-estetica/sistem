<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clínica Estética</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>Clínica Estética</h1>
                <p>Sistema de Acompanhamento</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                </div>
                <button type="submit" class="btn-login">Entrar</button>
                <p id="errorMessage" class="error-message"></p>
            </form>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="header">
            <h1>Clínica Estética - Dashboard</h1>
            <div class="header-actions">
                <span id="userName">Bem-vindo</span>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </div>
        <div class="content">
            <div class="dashboard-header">
                <h2>Clientes Cadastrados</h2>
                <button class="btn-new-client" onclick="goToCadastro()">+ Novo Cliente</button>
            </div>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Pesquisar cliente por nome, email ou telefone..." onkeyup="searchClients()">
            </div>
            
            <div class="clients-list" id="clientsList">
                <div class="empty-state">
                    <p>Nenhum cliente cadastrado ainda.</p>
                    <p>Clique em "Novo Cliente" para começar.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
