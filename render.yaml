services:
  - type: web
    name: sistema-finissima
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-finissima-db
          property: connectionString
      - key: NODE_ENV
        value: production
    plan: free

databases:
  - name: sistema-finissima-db
    databaseName: sistema_finissima
    user: sistema_finissima_user
    plan: free
